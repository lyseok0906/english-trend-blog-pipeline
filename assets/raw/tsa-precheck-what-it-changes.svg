<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1298" viewBox="0 0 800 1298" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Three steps: enter a Known Traveler Number to get the PreCheck indicator, what TSA says stays in the bag or on you in a PreCheck lane, and TSA's caveat that no one is guaranteed expedited screening.</title>
<rect width="800" height="1298" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">TSA PreCheck: what it</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">changes, per TSA</text>
<rect x="40" y="160" width="720" height="290" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="70" y="214" font-size="36" font-weight="bold" fill="#111827" text-anchor="start">1. Get the PreCheck lane</text>
<text x="70" y="270" font-size="32" fill="#111827" text-anchor="start">Known Traveler Number in the</text>
<text x="70" y="314" font-size="32" fill="#111827" text-anchor="start">airline reservation. The PreCheck</text>
<text x="70" y="358" font-size="32" fill="#111827" text-anchor="start">indicator must show on the</text>
<text x="70" y="402" font-size="32" fill="#111827" text-anchor="start">boarding pass. It is not automatic.</text>
<path d="M400 458 V528 M382 506 L400 528 L418 506" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="540" width="720" height="300" rx="14" fill="#bbf7d0" stroke="#374151" stroke-width="4"/>
<text x="70" y="594" font-size="36" font-weight="bold" fill="#111827" text-anchor="start">2. In a PreCheck lane, TSA says</text>
<text x="70" y="652" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">Stays in your bag:</text>
<text x="70" y="700" font-size="32" fill="#111827" text-anchor="start">electronics and 3-1-1 liquids</text>
<text x="70" y="748" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">You can keep on:</text>
<text x="70" y="796" font-size="32" fill="#111827" text-anchor="start">belts, light jackets and shoes</text>
<path d="M400 848 V918 M382 896 L400 918 L418 896" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="930" width="720" height="240" rx="14" fill="#fef9c3" stroke="#374151" stroke-width="4"/>
<text x="70" y="984" font-size="36" font-weight="bold" fill="#111827" text-anchor="start">3. No guarantee (TSA)</text>
<text x="70" y="1042" font-size="32" fill="#111827" text-anchor="start">All travelers will be screened.</text>
<text x="70" y="1086" font-size="32" fill="#111827" text-anchor="start">No individual is guaranteed</text>
<text x="70" y="1130" font-size="32" fill="#111827" text-anchor="start">expedited screening.</text>
<line x1="40" y1="1210" x2="760" y2="1210" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1262" font-size="26" fill="#4b5563" text-anchor="start">Source: TSA pages, read Oct. 7, 2026</text>
</svg>
