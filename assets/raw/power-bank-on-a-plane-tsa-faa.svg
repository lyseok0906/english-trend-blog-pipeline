<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1578" viewBox="0 0 800 1578" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Power banks on a plane: carry-on bags only; the watt-hour rating decides whether a battery is allowed, needs airline approval, or is forbidden.</title>
<rect width="800" height="1578" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">Power banks on a plane,</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">at a glance</text>
<rect x="40" y="160" width="720" height="116" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="70" y="214" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">A spare lithium battery</text>
<text x="70" y="262" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">or power bank</text>
<path d="M400 286 V346 M382 324 L400 346 L418 324" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="356" width="720" height="170" rx="14" fill="#fef3c7" stroke="#374151" stroke-width="4"/>
<text x="70" y="410" font-size="40" font-weight="bold" fill="#111827" text-anchor="start">Carry-on bag only</text>
<text x="70" y="468" font-size="32" fill="#111827" text-anchor="start">TSA: spare lithium batteries are</text>
<text x="70" y="510" font-size="32" fill="#111827" text-anchor="start">prohibited in checked luggage.</text>
<path d="M400 536 V596 M382 574 L400 596 L418 574" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="646" font-size="34" font-weight="bold" fill="#111827" text-anchor="start">Then check the watt-hour (Wh) rating:</text>
<rect x="40" y="670" width="720" height="126" rx="14" fill="#bbf7d0" stroke="#374151" stroke-width="4"/>
<text x="70" y="724" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">100 Wh or less</text>
<text x="70" y="780" font-size="34" fill="#111827" text-anchor="start">Allowed in carry-on (FAA).</text>
<rect x="40" y="816" width="720" height="176" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="870" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">101–160 Wh</text>
<text x="70" y="926" font-size="34" fill="#111827" text-anchor="start">Airline approval needed.</text>
<text x="70" y="974" font-size="32" fill="#111827" text-anchor="start">Two spare batteries at most (FAA).</text>
<rect x="40" y="1012" width="720" height="126" rx="14" fill="#fecaca" stroke="#374151" stroke-width="4"/>
<text x="70" y="1066" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Over 160 Wh</text>
<text x="70" y="1122" font-size="34" fill="#111827" text-anchor="start">Forbidden (FAA).</text>
<rect x="40" y="1168" width="720" height="236" rx="14" fill="#dbeafe" stroke="#374151" stroke-width="4"/>
<text x="70" y="1222" font-size="36" font-weight="bold" fill="#111827" text-anchor="start">No Wh on the label?</text>
<text x="70" y="1274" font-size="32" fill="#111827" text-anchor="start">FAA: volts x amp hours = Wh.</text>
<text x="70" y="1318" font-size="32" fill="#111827" text-anchor="start">For mAh, divide by 1000 first.</text>
<text x="70" y="1362" font-size="32" fill="#111827" text-anchor="start">FAA example: 12 V x 8 Ah = 96 Wh.</text>
<text x="40" y="1458" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">Your airline may set stricter limits.</text>
<line x1="40" y1="1488" x2="760" y2="1488" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1542" font-size="28" fill="#4b5563" text-anchor="start">Source: TSA and FAA websites, read Oct. 7, 2026</text>
</svg>
