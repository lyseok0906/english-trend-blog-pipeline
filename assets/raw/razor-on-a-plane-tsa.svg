<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1586" viewBox="0 0 800 1586" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<title>What TSA says about razors on a plane, from four TSA pages: disposable razor, safety razor with blades, razor-type blades and electric razors, with the carry-on and checked-bag lines and the extra instruction on each page.</title>
<rect width="800" height="1586" fill="#ffffff"/>
<text x="40" y="70" font-size="46" font-weight="bold" fill="#111827">Razors and TSA</text>
<text x="40" y="120" font-size="32" fill="#374151">Four TSA pages, four answers</text>
<rect x="40" y="170" width="720" height="222" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
<text x="70" y="224" font-size="36" font-weight="bold" fill="#111827">Disposable razor</text>
<text x="70" y="274" font-size="29" fill="#111827">Carry-on: Yes.   Checked: Yes.</text>
<text x="70" y="320" font-size="29" fill="#111827">Checked bag: sheathe or wrap</text>
<text x="70" y="366" font-size="29" fill="#111827">sharp objects.</text>
<rect x="40" y="418" width="720" height="314" rx="14" fill="#fef3c7" stroke="#92400e" stroke-width="4"/>
<text x="70" y="472" font-size="36" font-weight="bold" fill="#111827">Safety razor with blades</text>
<text x="70" y="522" font-size="29" fill="#111827">Header: carry-on No, checked Yes.</text>
<text x="70" y="568" font-size="29" fill="#111827">Text: allowed through the checkpoint</text>
<text x="70" y="614" font-size="29" fill="#111827">without the blade. Blade out before</text>
<text x="70" y="660" font-size="29" fill="#111827">the checkpoint; officers are not</text>
<text x="70" y="706" font-size="29" fill="#111827">authorized to remove it.</text>
<rect x="40" y="758" width="720" height="222" rx="14" fill="#fee2e2" stroke="#991b1b" stroke-width="4"/>
<text x="70" y="812" font-size="36" font-weight="bold" fill="#111827">Razor-type blades</text>
<text x="70" y="862" font-size="29" fill="#111827">Carry-on: No.   Checked: Yes.</text>
<text x="70" y="908" font-size="29" fill="#111827">Box cutters and razor blades not in</text>
<text x="70" y="954" font-size="29" fill="#111827">a cartridge: prohibited in carry-on.</text>
<rect x="40" y="1006" width="720" height="222" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
<text x="70" y="1060" font-size="36" font-weight="bold" fill="#111827">Electric razors</text>
<text x="70" y="1110" font-size="29" fill="#111827">Carry-on: Yes.   Checked: Yes.</text>
<text x="70" y="1156" font-size="29" fill="#111827">TSA: for regulation questions,</text>
<text x="70" y="1202" font-size="29" fill="#111827">see the FAA website.</text>
<rect x="40" y="1254" width="720" height="176" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="4" stroke-dasharray="10 8"/>
<text x="70" y="1308" font-size="36" font-weight="bold" fill="#111827">Every page says</text>
<text x="70" y="1358" font-size="29" fill="#111827">The final decision rests with the</text>
<text x="70" y="1404" font-size="29" fill="#111827">TSA officer.</text>
<text x="40" y="1506" font-size="25" fill="#374151">Sources: four TSA What Can I Bring? pages</text>
<text x="40" y="1542" font-size="25" fill="#374151">(2017 to July 2026), read Nov. 9, 2026</text>
</svg>