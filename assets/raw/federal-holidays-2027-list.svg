<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1544" viewBox="0 0 800 1544" font-family="Liberation Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Federal holidays in 2027 as printed on the OPM 2027 tab, with the three moved days marked, and the Dec. 31, 2027 date listed apart.</title>
<rect width="800" height="1544" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827">Federal holidays, 2027</text>
<text x="40" y="112" font-size="30" fill="#374151">As printed on the OPM 2027 tab</text>
<rect x="40" y="140" width="720" height="902" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="194" font-size="32" font-weight="bold" fill="#111827">Fri, Jan 1</text>
<text x="290" y="194" font-size="32" fill="#111827">New Year&#x27;s Day</text>
<text x="70" y="256" font-size="32" font-weight="bold" fill="#111827">Mon, Jan 18</text>
<text x="290" y="256" font-size="32" fill="#111827">Birthday of Martin Luther</text>
<text x="290" y="300" font-size="32" fill="#111827">King, Jr.</text>
<text x="70" y="362" font-size="32" font-weight="bold" fill="#111827">Mon, Feb 15</text>
<text x="290" y="362" font-size="32" fill="#111827">Washington&#x27;s Birthday</text>
<text x="70" y="424" font-size="32" font-weight="bold" fill="#111827">Mon, May 31</text>
<text x="290" y="424" font-size="32" fill="#111827">Memorial Day</text>
<rect x="52" y="448" width="696" height="138" rx="8" fill="#fde68a"/>
<text x="70" y="486" font-size="32" font-weight="bold" fill="#111827">Fri, Jun 18</text>
<text x="290" y="486" font-size="32" fill="#111827">Juneteenth National</text>
<text x="290" y="530" font-size="32" fill="#111827">Independence Day</text>
<text x="290" y="564" font-size="26" fill="#374151">Falls on Sat, Jun 19</text>
<rect x="52" y="590" width="696" height="94" rx="8" fill="#fde68a"/>
<text x="70" y="628" font-size="32" font-weight="bold" fill="#111827">Mon, Jul 5</text>
<text x="290" y="628" font-size="32" fill="#111827">Independence Day</text>
<text x="290" y="662" font-size="26" fill="#374151">Falls on Sun, Jul 4</text>
<text x="70" y="726" font-size="32" font-weight="bold" fill="#111827">Mon, Sep 6</text>
<text x="290" y="726" font-size="32" fill="#111827">Labor Day</text>
<text x="70" y="788" font-size="32" font-weight="bold" fill="#111827">Mon, Oct 11</text>
<text x="290" y="788" font-size="32" fill="#111827">Columbus Day</text>
<text x="70" y="850" font-size="32" font-weight="bold" fill="#111827">Thu, Nov 11</text>
<text x="290" y="850" font-size="32" fill="#111827">Veterans Day</text>
<text x="70" y="912" font-size="32" font-weight="bold" fill="#111827">Thu, Nov 25</text>
<text x="290" y="912" font-size="32" fill="#111827">Thanksgiving Day</text>
<rect x="52" y="936" width="696" height="94" rx="8" fill="#fde68a"/>
<text x="70" y="974" font-size="32" font-weight="bold" fill="#111827">Fri, Dec 24</text>
<text x="290" y="974" font-size="32" fill="#111827">Christmas Day</text>
<text x="290" y="1008" font-size="26" fill="#374151">Falls on Sat, Dec 25</text>
<text x="40" y="1084" font-size="26" fill="#374151">Yellow: OPM shows a moved day (footnote).</text>
<rect x="40" y="1114" width="720" height="238" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="70" y="1170" font-size="34" font-weight="bold" fill="#111827">Listed apart</text>
<text x="70" y="1220" font-size="32" fill="#111827">Fri, Dec 31, 2027: the observed date</text>
<text x="70" y="1264" font-size="32" fill="#111827">for New Year&#x27;s Day 2028. It is on OPM&#x27;s</text>
<text x="70" y="1308" font-size="32" fill="#111827">2028 tab, not on the 2027 list above.</text>
<line x1="40" y1="1386" x2="760" y2="1386" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1430" font-size="26" fill="#4b5563">Source: OPM Federal Holidays, 2027 and 2028 tabs</text>
<text x="40" y="1470" font-size="26" fill="#4b5563">Weekdays of Jun 19, Jul 4 and Dec 25 computed</text>
<text x="40" y="1510" font-size="26" fill="#4b5563">Pages read Nov. 4, 2026</text>
</svg>
