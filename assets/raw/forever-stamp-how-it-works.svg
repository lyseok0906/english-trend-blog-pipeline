<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1520" viewBox="0 0 800 1520" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How a Forever stamp works: it stays valid for the 1 ounce First-Class Mail rate; heavier domestic mail and international mail are handled differently.</title>
<rect width="800" height="1520" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">How a Forever stamp</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">works, at a glance</text>
<rect x="40" y="160" width="720" height="116" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="400" y="232" font-size="38" font-weight="bold" fill="#111827" text-anchor="middle">You have a Forever stamp</text>
<path d="M400 286 V346 M382 324 L400 346 L418 324" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="356" width="720" height="186" rx="14" fill="#fef3c7" stroke="#374151" stroke-width="4"/>
<text x="400" y="410" font-size="36" font-weight="bold" fill="#111827" text-anchor="middle">USPS: always valid for the</text>
<text x="400" y="458" font-size="36" font-weight="bold" fill="#111827" text-anchor="middle">First-Class Mail 1 oz rate, even</text>
<text x="400" y="506" font-size="36" font-weight="bold" fill="#111827" text-anchor="middle">if postage rates increase</text>
<path d="M400 552 V612 M382 590 L400 612 L418 590" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="622" width="720" height="240" rx="14" fill="#bbf7d0" stroke="#374151" stroke-width="4"/>
<text x="70" y="676" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Domestic mail up to 1 oz</text>
<text x="70" y="732" font-size="34" fill="#111827" text-anchor="start">The stamp pays the 1 oz rate.</text>
<text x="70" y="782" font-size="32" fill="#111827" text-anchor="start">USPS: for letters and cards</text>
<text x="70" y="824" font-size="32" fill="#111827" text-anchor="start">sent within the U.S.</text>
<rect x="40" y="886" width="720" height="236" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="940" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Domestic mail over 1 oz</text>
<text x="70" y="996" font-size="32" fill="#111827" text-anchor="start">USPS price list: letters up to</text>
<text x="70" y="1040" font-size="32" fill="#111827" text-anchor="start">2 oz and 3 oz cost more than</text>
<text x="70" y="1084" font-size="32" fill="#111827" text-anchor="start">letters up to 1 oz.</text>
<rect x="40" y="1146" width="720" height="244" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="1200" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">International mail</text>
<text x="70" y="1256" font-size="34" fill="#111827" text-anchor="start">USPS describes a separate</text>
<text x="70" y="1304" font-size="34" fill="#111827" text-anchor="start">stamp for it, called the</text>
<text x="70" y="1352" font-size="34" fill="#111827" text-anchor="start">Global Forever.</text>
<line x1="40" y1="1430" x2="760" y2="1430" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1484" font-size="28" fill="#4b5563" text-anchor="start">Source: USPS websites, read Oct. 7, 2026</text>
</svg>
