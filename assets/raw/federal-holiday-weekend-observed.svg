<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1406" viewBox="0 0 800 1406" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>For most federal employees, a federal holiday on a Saturday is treated as the Friday before, and one on a Sunday as the Monday after. Five examples from OPM tables.</title>
<rect width="800" height="1406" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">Federal holiday on a</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">weekend: what changes</text>
<text x="40" y="170" font-size="32" fill="#374151" text-anchor="start">For most federal employees (OPM)</text>
<rect x="40" y="200" width="350" height="170" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="215" y="256" font-size="38" font-weight="bold" fill="#111827" text-anchor="middle">Saturday</text>
<text x="215" y="306" font-size="30" fill="#111827" text-anchor="middle">holiday is treated</text>
<text x="215" y="346" font-size="30" fill="#111827" text-anchor="middle">as the Friday before</text>
<rect x="410" y="200" width="350" height="170" rx="14" fill="#bbf7d0" stroke="#374151" stroke-width="4"/>
<text x="585" y="256" font-size="38" font-weight="bold" fill="#111827" text-anchor="middle">Sunday</text>
<text x="585" y="306" font-size="30" fill="#111827" text-anchor="middle">holiday is treated</text>
<text x="585" y="346" font-size="30" fill="#111827" text-anchor="middle">as the Monday after</text>
<text x="40" y="436" font-size="36" font-weight="bold" fill="#111827" text-anchor="start">Examples in OPM's tables</text>
<rect x="40" y="460" width="720" height="150" rx="14" fill="#ffffff" stroke="#374151" stroke-width="4"/>
<rect x="40" y="460" width="18" height="150" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="80" y="506" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">Independence Day 2026</text>
<text x="80" y="550" font-size="30" fill="#111827" text-anchor="start">Saturday, July 4</text>
<text x="80" y="590" font-size="30" fill="#111827" text-anchor="start">treated as Friday, July 3</text>
<rect x="40" y="630" width="720" height="150" rx="14" fill="#ffffff" stroke="#374151" stroke-width="4"/>
<rect x="40" y="630" width="18" height="150" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="80" y="676" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">Juneteenth 2027</text>
<text x="80" y="720" font-size="30" fill="#111827" text-anchor="start">Saturday, June 19</text>
<text x="80" y="760" font-size="30" fill="#111827" text-anchor="start">treated as Friday, June 18</text>
<rect x="40" y="800" width="720" height="150" rx="14" fill="#ffffff" stroke="#374151" stroke-width="4"/>
<rect x="40" y="800" width="18" height="150" fill="#bbf7d0" stroke="#374151" stroke-width="4"/>
<text x="80" y="846" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">Independence Day 2027</text>
<text x="80" y="890" font-size="30" fill="#111827" text-anchor="start">Sunday, July 4</text>
<text x="80" y="930" font-size="30" fill="#111827" text-anchor="start">treated as Monday, July 5</text>
<rect x="40" y="970" width="720" height="150" rx="14" fill="#ffffff" stroke="#374151" stroke-width="4"/>
<rect x="40" y="970" width="18" height="150" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="80" y="1016" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">Christmas 2027</text>
<text x="80" y="1060" font-size="30" fill="#111827" text-anchor="start">Saturday, December 25</text>
<text x="80" y="1100" font-size="30" fill="#111827" text-anchor="start">treated as Friday, December 24</text>
<rect x="40" y="1140" width="720" height="150" rx="14" fill="#ffffff" stroke="#374151" stroke-width="4"/>
<rect x="40" y="1140" width="18" height="150" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="80" y="1186" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">New Year's Day 2028</text>
<text x="80" y="1230" font-size="30" fill="#111827" text-anchor="start">Saturday, January 1</text>
<text x="80" y="1270" font-size="30" fill="#111827" text-anchor="start">treated as Friday, December 31</text>
<line x1="40" y1="1320" x2="760" y2="1320" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1368" font-size="26" fill="#4b5563" text-anchor="start">Source: OPM and 5 U.S.C. 6103, read Oct. 7, 2026</text>
</svg>
