<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Daylight saving time in the U.S., 2026: March 8 to November 1; clocks go back from 2:00 a.m. to 1:00 a.m.</title>
<rect width="800" height="1100" fill="#ffffff"/>
<text x="40" y="70" font-size="46" font-weight="bold" fill="#111827">Daylight saving time, 2026</text>

<text x="170" y="170" font-size="38" font-weight="bold" fill="#111827" text-anchor="middle">March 8</text>
<text x="640" y="170" font-size="38" font-weight="bold" fill="#111827" text-anchor="middle">November 1</text>
<line x1="170" y1="186" x2="170" y2="226" stroke="#111827" stroke-width="4"/>
<line x1="640" y1="186" x2="640" y2="226" stroke="#111827" stroke-width="4"/>
<rect x="40" y="226" width="720" height="70" fill="#e5e7eb"/>
<rect x="170" y="226" width="469" height="70" fill="#f59e0b"/>
<text x="405" y="274" font-size="36" font-weight="bold" fill="#111827" text-anchor="middle">Daylight saving time</text>

<line x1="40" y1="370" x2="760" y2="370" stroke="#d1d5db" stroke-width="3"/>

<text x="40" y="450" font-size="46" font-weight="bold" fill="#111827">Night of November 1</text>

<rect x="40" y="490" width="290" height="170" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="185" y="570" font-size="54" font-weight="bold" fill="#111827" text-anchor="middle">2:00 a.m.</text>
<text x="185" y="624" font-size="34" fill="#111827" text-anchor="middle">daylight time</text>

<path d="M350 575 H440 M416 545 L446 575 L416 605" stroke="#111827" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="470" y="490" width="290" height="170" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="615" y="570" font-size="54" font-weight="bold" fill="#111827" text-anchor="middle">1:00 a.m.</text>
<text x="615" y="624" font-size="34" fill="#111827" text-anchor="middle">standard time</text>

<text x="40" y="730" font-size="38" fill="#111827">Clocks go back one hour.</text>

<line x1="40" y1="780" x2="760" y2="780" stroke="#d1d5db" stroke-width="3"/>

<text x="40" y="850" font-size="46" font-weight="bold" fill="#111827">1–2 a.m. happens twice</text>

<rect x="40" y="880" width="720" height="80" rx="12" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="934" font-size="36" fill="#111827"><tspan font-weight="bold">1:00–2:00 a.m.</tspan> first time</text>
<rect x="40" y="980" width="720" height="80" rx="12" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="1034" font-size="36" fill="#111827"><tspan font-weight="bold">1:00–2:00 a.m.</tspan> second time</text>
</svg>