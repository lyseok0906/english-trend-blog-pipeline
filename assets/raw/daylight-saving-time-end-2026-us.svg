<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="60" y="52" font-size="28" font-weight="bold" fill="#111827">Daylight saving time in the U.S., 2026</text>
<text x="60" y="84" font-size="18" fill="#4b5563">Clocks move on Sundays at 2:00 a.m. local time</text>
<rect x="80" y="140" width="1040" height="30" fill="#e5e7eb"/>
<rect x="268.1" y="140" width="678.1" height="30" fill="#f59e0b"/>
<text x="607.1" y="161" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Daylight saving time</text>
<line x1="80.0" y1="170" x2="80.0" y2="190" stroke="#6b7280" stroke-width="1.5"/><text x="84.0" y="212" font-size="16" fill="#4b5563">Jan</text><line x1="168.3" y1="170" x2="168.3" y2="190" stroke="#6b7280" stroke-width="1.5"/><text x="172.3" y="212" font-size="16" fill="#4b5563">Feb</text><line x1="248.1" y1="170" x2="248.1" y2="190" stroke="#6b7280" stroke-width="1.5"/><text x="252.1" y="212" font-size="16" fill="#4b5563">Mar</text><line x1="336.4" y1="170" x2="336.4" y2="190" stroke="#6b7280" stroke-width="1.5"/><text x="340.4" y="212" font-size="16" fill="#4b5563">Apr</text><line x1="421.9" y1="170" x2="421.9" y2="190" stroke="#6b7280" stroke-width="1.5"/><text x="425.9" y="212" font-size="16" fill="#4b5563">May</text><line x1="510.2" y1="170" x2="510.2" y2="190" stroke="#6b7280" stroke-width="1.5"/><text x="514.2" y="212" font-size="16" fill="#4b5563">Jun</text><line x1="595.7" y1="170" x2="595.7" y2="190" stroke="#6b7280" stroke-width="1.5"/><text x="599.7" y="212" font-size="16" fill="#4b5563">Jul</text><line x1="684.1" y1="170" x2="684.1" y2="190" stroke="#6b7280" stroke-width="1.5"/><text x="688.1" y="212" font-size="16" fill="#4b5563">Aug</text><line x1="772.4" y1="170" x2="772.4" y2="190" stroke="#6b7280" stroke-width="1.5"/><text x="776.4" y="212" font-size="16" fill="#4b5563">Sep</text><line x1="857.9" y1="170" x2="857.9" y2="190" stroke="#6b7280" stroke-width="1.5"/><text x="861.9" y="212" font-size="16" fill="#4b5563">Oct</text><line x1="946.2" y1="170" x2="946.2" y2="190" stroke="#6b7280" stroke-width="1.5"/><text x="950.2" y="212" font-size="16" fill="#4b5563">Nov</text><line x1="1031.7" y1="170" x2="1031.7" y2="190" stroke="#6b7280" stroke-width="1.5"/><text x="1035.7" y="212" font-size="16" fill="#4b5563">Dec</text>
<line x1="268.1" y1="128" x2="268.1" y2="170" stroke="#111827" stroke-width="2"/>
<line x1="946.2" y1="128" x2="946.2" y2="170" stroke="#111827" stroke-width="2"/>
<text x="268.1" y="122" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Sun, March 8</text>
<text x="946.2" y="122" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Sun, November 1</text>
<text x="268.1" y="246" font-size="16" fill="#111827" text-anchor="middle">Starts: 2:00 a.m. becomes 3:00 a.m.</text>
<text x="946.2" y="246" font-size="16" fill="#111827" text-anchor="middle">Ends: 2:00 a.m. becomes 1:00 a.m.</text>
<text x="60" y="300" font-size="22" font-weight="bold" fill="#111827">Night of November 1, 2026</text>
<text x="60" y="328" font-size="17" fill="#4b5563">The hour from 1:00 to 2:00 a.m. happens twice</text>
<rect x="80" y="360" width="240" height="110" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="2"/><text x="200" y="410" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">12:00–1:00 a.m.</text><text x="200" y="445" font-size="16" fill="#111827" text-anchor="middle">DST</text><rect x="340" y="360" width="240" height="110" rx="8" fill="#fde68a" stroke="#374151" stroke-width="2"/><text x="460" y="410" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">1:00–2:00 a.m.</text><text x="460" y="445" font-size="16" fill="#111827" text-anchor="middle">DST (first time)</text><rect x="600" y="360" width="240" height="110" rx="8" fill="#bfdbfe" stroke="#374151" stroke-width="2"/><text x="720" y="410" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">1:00–2:00 a.m.</text><text x="720" y="445" font-size="16" fill="#111827" text-anchor="middle">Standard time (second time)</text><rect x="860" y="360" width="240" height="110" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="2"/><text x="980" y="410" font-size="24" font-weight="bold" fill="#111827" text-anchor="middle">2:00–3:00 a.m.</text><text x="980" y="445" font-size="16" fill="#111827" text-anchor="middle">Standard time</text><path d="M320 415 h20" stroke="#374151" stroke-width="3" fill="none"/><path d="M580 415 h20" stroke="#374151" stroke-width="3" fill="none"/><path d="M840 415 h20" stroke="#374151" stroke-width="3" fill="none"/><text x="60" y="520" font-size="17" fill="#111827">At 2:00 a.m. daylight saving time, clocks go back to 1:00 a.m. standard time.</text>
<text x="60" y="552" font-size="14" fill="#4b5563">Rule: 2:00 a.m. on the second Sunday in March to 2:00 a.m. on the first Sunday in November (15 U.S.C. § 260a).</text>
<text x="60" y="578" font-size="14" fill="#4b5563">Hawaii, most of Arizona and several U.S. territories do not observe daylight saving time.</text>
<text x="60" y="612" font-size="13" fill="#6b7280">Original diagram. Dates checked against NIST and U.S. DOT pages on October 6, 2026.</text>
</svg>