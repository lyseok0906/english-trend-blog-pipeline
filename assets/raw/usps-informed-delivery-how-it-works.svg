<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1550" viewBox="0 0 800 1550" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How USPS Informed Delivery works: letters are imaged on the address side, shown in a daily email, dashboard and app; catalogs and magazines are not imaged; packages show as status updates.</title>
<rect width="800" height="1550" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">How Informed Delivery</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">works, at a glance</text>
<rect x="40" y="160" width="720" height="170" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="70" y="214" font-size="36" font-weight="bold" fill="#111827" text-anchor="start">A letter-sized mailpiece</text>
<text x="70" y="262" font-size="32" fill="#111827" text-anchor="start">runs through USPS automated</text>
<text x="70" y="304" font-size="32" fill="#111827" text-anchor="start">sorting equipment.</text>
<path d="M400 340 V400 M382 378 L400 400 L418 378" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="410" width="720" height="170" rx="14" fill="#fef3c7" stroke="#374151" stroke-width="4"/>
<text x="70" y="464" font-size="36" font-weight="bold" fill="#111827" text-anchor="start">USPS images the address side</text>
<text x="70" y="512" font-size="32" fill="#111827" text-anchor="start">It shows only the exterior of</text>
<text x="70" y="554" font-size="32" fill="#111827" text-anchor="start">the mailpiece (USPS).</text>
<path d="M400 590 V650 M382 628 L400 650 L418 628" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="660" width="720" height="300" rx="14" fill="#bbf7d0" stroke="#374151" stroke-width="4"/>
<text x="70" y="714" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">You see it in</text>
<text x="70" y="770" font-size="32" fill="#111827" text-anchor="start">Daily Digest email: up to 10</text>
<text x="70" y="814" font-size="32" fill="#111827" text-anchor="start">letters, typically before 9:00 AM</text>
<text x="70" y="858" font-size="32" fill="#111827" text-anchor="start">local time, Monday to Saturday</text>
<text x="70" y="902" font-size="32" fill="#111827" text-anchor="start">Online dashboard and mobile app</text>
<rect x="40" y="984" width="720" height="236" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="1038" font-size="36" font-weight="bold" fill="#111827" text-anchor="start">What is not shown as an image</text>
<text x="70" y="1090" font-size="32" fill="#111827" text-anchor="start">Catalogs and magazines: not</text>
<text x="70" y="1134" font-size="32" fill="#111827" text-anchor="start">imaged by the equipment.</text>
<text x="70" y="1178" font-size="32" fill="#111827" text-anchor="start">Packages: status updates only.</text>
<rect x="40" y="1244" width="720" height="176" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="1298" font-size="34" font-weight="bold" fill="#111827" text-anchor="start">A preview is not a delivery date</text>
<text x="70" y="1350" font-size="32" fill="#111827" text-anchor="start">USPS: allow several days, up to</text>
<text x="70" y="1394" font-size="32" fill="#111827" text-anchor="start">one week, for the mailpiece.</text>
<line x1="40" y1="1460" x2="760" y2="1460" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1514" font-size="28" fill="#4b5563" text-anchor="start">Source: USPS websites, read Oct. 7, 2026</text>
</svg>
