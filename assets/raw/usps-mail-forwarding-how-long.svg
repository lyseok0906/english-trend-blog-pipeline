<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1798" viewBox="0 0 800 1798" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Timeline of USPS mail forwarding: request, 12 months of standard forwarding with an optional paid extension, then mail returned to the sender for 6 months with a new-address label.</title>
<rect width="800" height="1798" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">How long USPS mail</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">forwarding lasts</text>
<rect x="40" y="160" width="720" height="290" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="70" y="214" font-size="34" font-weight="bold" fill="#111827" text-anchor="start">1. Request a change of address</text>
<text x="70" y="270" font-size="32" fill="#111827" text-anchor="start">Forwarding may begin within</text>
<text x="70" y="314" font-size="32" fill="#111827" text-anchor="start">3 business days. USPS says it is</text>
<text x="70" y="358" font-size="32" fill="#111827" text-anchor="start">best to allow up to 2 weeks.</text>
<path d="M400 458 V528 M382 506 L400 528 L418 506" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="540" width="720" height="330" rx="14" fill="#bbf7d0" stroke="#374151" stroke-width="4"/>
<text x="70" y="594" font-size="34" font-weight="bold" fill="#111827" text-anchor="start">2. Permanent forwarding: 12 months</text>
<text x="70" y="650" font-size="32" fill="#111827" text-anchor="start">Mail is forwarded piece by piece.</text>
<text x="70" y="694" font-size="32" fill="#111827" text-anchor="start">First-Class Mail is forwarded</text>
<text x="70" y="738" font-size="32" fill="#111827" text-anchor="start">for free.</text>
<text x="70" y="782" font-size="32" fill="#111827" text-anchor="start">USPS Marketing Mail is not forwarded.</text>
<path d="M400 878 V948 M382 926 L400 948 L418 926" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="960" width="720" height="330" rx="14" fill="#fef9c3" stroke="#374151" stroke-width="4" stroke-dasharray="14 8"/>
<text x="70" y="1014" font-size="34" font-weight="bold" fill="#111827" text-anchor="start">Optional: Extended Mail Forwarding</text>
<text x="70" y="1070" font-size="32" fill="#111827" text-anchor="start">Paid. Permanent change of address</text>
<text x="70" y="1114" font-size="32" fill="#111827" text-anchor="start">only. In 6, 12 or 18-month steps;</text>
<text x="70" y="1158" font-size="32" fill="#111827" text-anchor="start">up to 18 months of extension.</text>
<text x="70" y="1202" font-size="32" fill="#111827" text-anchor="start">It cannot be canceled or refunded.</text>
<path d="M400 1298 V1368 M382 1346 L400 1368 L418 1346" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="1380" width="720" height="290" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="1434" font-size="34" font-weight="bold" fill="#111827" text-anchor="start">3. Forwarding ends</text>
<text x="70" y="1490" font-size="32" fill="#111827" text-anchor="start">USPS returns mail to the sender</text>
<text x="70" y="1534" font-size="32" fill="#111827" text-anchor="start">for 6 months, with a label that</text>
<text x="70" y="1578" font-size="32" fill="#111827" text-anchor="start">has your new address.</text>
<line x1="40" y1="1710" x2="760" y2="1710" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1762" font-size="26" fill="#4b5563" text-anchor="start">Source: USPS pages, read Oct. 7, 2026</text>
</svg>
