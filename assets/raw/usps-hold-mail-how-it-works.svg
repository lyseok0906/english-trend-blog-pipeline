<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1778" viewBox="0 0 800 1778" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Timeline of a USPS Hold Mail request: request, start day, a hold of 3 to 30 days, and the last day when the held mail is delivered or picked up within 10 days.</title>
<rect width="800" height="1778" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">How a USPS Hold Mail</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">request runs</text>
<rect x="40" y="160" width="720" height="290" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="70" y="214" font-size="36" font-weight="bold" fill="#111827" text-anchor="start">1. Request</text>
<text x="70" y="270" font-size="32" fill="#111827" text-anchor="start">Online: sign in to USPS.com</text>
<text x="70" y="314" font-size="32" fill="#111827" text-anchor="start">and verify your identity.</text>
<text x="70" y="358" font-size="32" fill="#111827" text-anchor="start">Up to 30 days ahead, or as early</text>
<text x="70" y="402" font-size="32" fill="#111827" text-anchor="start">as the next scheduled delivery day.</text>
<path d="M400 458 V528 M382 506 L400 528 L418 506" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="540" width="720" height="270" rx="14" fill="#fef9c3" stroke="#374151" stroke-width="4"/>
<text x="70" y="594" font-size="36" font-weight="bold" fill="#111827" text-anchor="start">2. Start day</text>
<text x="70" y="650" font-size="32" fill="#111827" text-anchor="start">Same-day start: request by</text>
<text x="70" y="694" font-size="32" fill="#111827" text-anchor="start">2:00 a.m. Central Time (USPS FAQ).</text>
<text x="70" y="738" font-size="32" fill="#111827" text-anchor="start">Postal business days:</text>
<text x="70" y="782" font-size="32" fill="#111827" text-anchor="start">Monday to Saturday, not holidays.</text>
<path d="M400 818 V888 M382 866 L400 888 L418 866" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="900" width="720" height="330" rx="14" fill="#bbf7d0" stroke="#374151" stroke-width="4"/>
<text x="70" y="954" font-size="36" font-weight="bold" fill="#111827" text-anchor="start">3. Hold: 3 to 30 days</text>
<text x="70" y="1010" font-size="32" fill="#111827" text-anchor="start">USPS holds all mail at your</text>
<text x="70" y="1054" font-size="32" fill="#111827" text-anchor="start">local Post Office.</text>
<text x="70" y="1098" font-size="32" fill="#111827" text-anchor="start">Longer than 30 days: USPS points</text>
<text x="70" y="1142" font-size="32" fill="#111827" text-anchor="start">to a forwarding service.</text>
<text x="70" y="1186" font-size="32" fill="#111827" text-anchor="start">At least 3 days between holds.</text>
<path d="M400 1238 V1308 M382 1286 L400 1308 L418 1286" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="1320" width="720" height="330" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="1374" font-size="36" font-weight="bold" fill="#111827" text-anchor="start">4. Last day of the hold</text>
<text x="70" y="1430" font-size="32" fill="#111827" text-anchor="start">The carrier delivers your</text>
<text x="70" y="1474" font-size="32" fill="#111827" text-anchor="start">held mail, or you pick it up</text>
<text x="70" y="1518" font-size="32" fill="#111827" text-anchor="start">at the Post Office.</text>
<text x="70" y="1562" font-size="32" fill="#111827" text-anchor="start">Pickup: within 10 days, or the</text>
<text x="70" y="1606" font-size="32" fill="#111827" text-anchor="start">mail is returned to the senders.</text>
<line x1="40" y1="1690" x2="760" y2="1690" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1742" font-size="26" fill="#4b5563" text-anchor="start">Source: USPS pages, read Oct. 7, 2026</text>
</svg>
