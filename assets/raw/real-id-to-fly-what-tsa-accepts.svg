<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1738" viewBox="0 0 800 1738" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Flowchart: an adult at the TSA checkpoint shows an ID on TSA's list; without one, the fee-based TSA ConfirmID option may apply.</title>
<rect width="800" height="1738" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">Flying in the U.S.:</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">what ID does TSA take?</text>
<rect x="40" y="160" width="720" height="150" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="70" y="214" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Adult 18 or older</text>
<text x="70" y="268" font-size="34" fill="#111827" text-anchor="start">at the TSA checkpoint</text>
<path d="M400 318 V388 M382 366 L400 388 L418 366" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="400" width="720" height="200" rx="14" fill="#fef9c3" stroke="#374151" stroke-width="4"/>
<text x="70" y="454" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Is your ID on TSA's list?</text>
<text x="70" y="510" font-size="32" fill="#111827" text-anchor="start">The list can change without</text>
<text x="70" y="554" font-size="32" fill="#111827" text-anchor="start">notice (TSA).</text>
<path d="M250 608 V678 M232 656 L250 678 L268 656" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="280" y="656" font-size="30" font-weight="bold" fill="#111827" text-anchor="start">ID is on the list</text>
<rect x="40" y="690" width="720" height="500" rx="14" fill="#bbf7d0" stroke="#374151" stroke-width="4"/>
<text x="70" y="744" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">If yes: show it</text>
<text x="70" y="802" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">Examples on TSA's list:</text>
<text x="70" y="850" font-size="32" fill="#111827" text-anchor="start">REAL ID-compliant license or ID</text>
<text x="70" y="894" font-size="32" fill="#111827" text-anchor="start">U.S. passport or passport card</text>
<text x="70" y="938" font-size="32" fill="#111827" text-anchor="start">DHS trusted traveler card</text>
<text x="70" y="982" font-size="32" fill="#111827" text-anchor="start">U.S. Department of Defense ID</text>
<text x="70" y="1026" font-size="32" fill="#111827" text-anchor="start">Permanent resident card</text>
<text x="70" y="1070" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">Not accepted since May 7, 2025:</text>
<text x="70" y="1114" font-size="32" fill="#111827" text-anchor="start">a state license or ID that is</text>
<text x="70" y="1156" font-size="32" fill="#111827" text-anchor="start">not REAL ID compliant</text>
<path d="M250 1198 V1268 M232 1246 L250 1268 L268 1246" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="280" y="1246" font-size="30" font-weight="bold" fill="#111827" text-anchor="start">ID is not on the list</text>
<rect x="40" y="1280" width="720" height="330" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="1334" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">If no: TSA ConfirmID</text>
<text x="70" y="1392" font-size="32" fill="#111827" text-anchor="start">Fee-based identity check</text>
<text x="70" y="1436" font-size="32" fill="#111827" text-anchor="start">Average 10-15 minutes;</text>
<text x="70" y="1480" font-size="32" fill="#111827" text-anchor="start">could take 30 minutes or more</text>
<text x="70" y="1524" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">If identity cannot be verified:</text>
<text x="70" y="1568" font-size="32" fill="#111827" text-anchor="start">no entry to the checkpoint</text>
<line x1="40" y1="1650" x2="760" y2="1650" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1702" font-size="26" fill="#4b5563" text-anchor="start">Source: TSA pages, read Oct. 7, 2026</text>
</svg>
