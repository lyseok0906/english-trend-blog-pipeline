<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1816" viewBox="0 0 800 1816" font-family="Liberation Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Holiday food at TSA: what the TSA Food page and a Nov. 24, 2025 Harrisburg local release say, and where they differ.</title>
<rect width="800" height="1816" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">Holiday food at TSA</text>
<rect x="40" y="160" width="720" height="476" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="216" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">TSA Food page</text>
<text x="70" y="270" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Carry-on and checked: pies, cakes,</text>
<text x="70" y="314" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">cookies, cooked meat.</text>
<text x="70" y="374" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Carry-on up to 3.4 oz (100 ml): gravy,</text>
<text x="70" y="418" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">jam and jelly, maple syrup, sauces,</text>
<text x="70" y="462" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">soups.</text>
<text x="70" y="522" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Special instructions: canned foods,</text>
<text x="70" y="566" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">fresh meat and seafood, frozen food,</text>
<text x="70" y="610" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">fresh fruits and vegetables.</text>
<rect x="40" y="658" width="720" height="520" rx="14" fill="#d9f99d" stroke="#374151" stroke-width="4"/>
<text x="70" y="714" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">TSA local release (2025)</text>
<text x="70" y="768" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Harrisburg International Airport,</text>
<text x="70" y="812" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Nov. 24, 2025.</text>
<text x="70" y="872" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Through the checkpoint: baked goods,</text>
<text x="70" y="916" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">turkey and other meats, stuffing, solid</text>
<text x="70" y="960" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">casseroles, mac and cheese, fresh</text>
<text x="70" y="1004" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">fruit, candy.</text>
<text x="70" y="1064" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Checked bags: cranberry sauce, gravy,</text>
<text x="70" y="1108" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">canned items in liquid, jams, jellies,</text>
<text x="70" y="1152" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">maple syrup.</text>
<rect x="40" y="1200" width="720" height="328" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="1256" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Where the two differ</text>
<text x="70" y="1310" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Gravy, jam and jelly, maple syrup: Food</text>
<text x="70" y="1354" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">page allows up to 3.4 oz in a carry-on;</text>
<text x="70" y="1398" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">the release says checked.</text>
<text x="70" y="1458" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Cranberry sauce: named in the release</text>
<text x="70" y="1502" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">only.</text>
<text x="40" y="1584" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">The TSA officer makes the final decision</text>
<text x="40" y="1628" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">at the checkpoint.</text>
<line x1="40" y1="1662" x2="760" y2="1662" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1706" font-size="26" fill="#4b5563" text-anchor="start">No 2026 TSA Thanksgiving release found: Nov. 4, 2026</text>
<text x="40" y="1746" font-size="26" fill="#4b5563" text-anchor="start">Source: tsa.gov Food page and Harrisburg release</text>
<text x="40" y="1786" font-size="26" fill="#4b5563" text-anchor="start">Pages read Nov. 4, 2026</text>
</svg>
