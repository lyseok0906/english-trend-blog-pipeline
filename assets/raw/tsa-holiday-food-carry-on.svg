<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2578" viewBox="0 0 800 2578" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<title>Holiday food at TSA: what the TSA Food page and eight local Thanksgiving releases of Nov. 18 and 23, 2026 say, and how their conditions fit.</title>
<rect width="800" height="2578" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">Holiday food at TSA</text>
<rect x="40" y="160" width="720" height="668" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="216" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">TSA Food page</text>
<text x="70" y="270" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Carry-on and checked: pies, cakes,</text>
<text x="70" y="314" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">cookies, cooked meat.</text>
<text x="70" y="374" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Carry-on, in containers of 3.4 oz</text>
<text x="70" y="418" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">(100 ml) or less, in a quart-sized bag:</text>
<text x="70" y="462" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">gravy, jam and jelly, maple syrup,</text>
<text x="70" y="506" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">sauces, soups.</text>
<text x="70" y="566" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Special instructions: canned foods (may</text>
<text x="70" y="610" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">need additional screening), fresh meat</text>
<text x="70" y="654" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">and seafood, frozen food, fresh fruits</text>
<text x="70" y="698" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">and vegetables.</text>
<text x="70" y="758" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">TSA liquids page: the limit is per</text>
<text x="70" y="802" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">container, not a total.</text>
<rect x="40" y="850" width="720" height="564" rx="14" fill="#d9f99d" stroke="#374151" stroke-width="4"/>
<text x="70" y="906" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">TSA local releases (Nov. 2026)</text>
<text x="70" y="960" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Eight airports, Nov. 18 and 23, 2026;</text>
<text x="70" y="1004" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">same food list.</text>
<text x="70" y="1064" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Carry-on, solids: pies, cakes, cookies,</text>
<text x="70" y="1108" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">turkey and other meats, stuffing, solid</text>
<text x="70" y="1152" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">casseroles, mac &#x27;n&#x27; cheese, fresh</text>
<text x="70" y="1196" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">produce.</text>
<text x="70" y="1256" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Checked bags (liquids or spreads over</text>
<text x="70" y="1300" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">3.4 oz): cranberry sauce, gravy, canned</text>
<text x="70" y="1344" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">goods in liquid, jams, jellies, maple</text>
<text x="70" y="1388" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">syrup.</text>
<rect x="40" y="1436" width="720" height="520" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="1492" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">How the two fit</text>
<text x="70" y="1546" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Food page: in a carry-on, 3.4 oz or</text>
<text x="70" y="1590" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">less per container. Releases: checked</text>
<text x="70" y="1634" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">bags for liquids and spreads over</text>
<text x="70" y="1678" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">3.4 oz.</text>
<text x="70" y="1738" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">The two cover different sizes. The</text>
<text x="70" y="1782" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">releases’ lists do not describe smaller</text>
<text x="70" y="1826" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">containers.</text>
<text x="70" y="1886" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Cranberry sauce: named in the releases</text>
<text x="70" y="1930" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">only.</text>
<rect x="40" y="1978" width="720" height="312" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="70" y="2034" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Compared with Nov. 2025</text>
<text x="70" y="2088" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Harrisburg release, Nov. 24, 2025: no</text>
<text x="70" y="2132" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">figure on the checked-bag list; a 3-1-1</text>
<text x="70" y="2176" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">note for casseroles with liquid. The</text>
<text x="70" y="2220" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">2026 releases: the figure is in the</text>
<text x="70" y="2264" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">checked-bag heading; no casserole note.</text>
<text x="40" y="2346" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">The TSA officer makes the final decision</text>
<text x="40" y="2390" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">at the checkpoint.</text>
<line x1="40" y1="2424" x2="760" y2="2424" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="2468" font-size="26" fill="#4b5563" text-anchor="start">No national Thanksgiving release listed: Nov. 24, 2026</text>
<text x="40" y="2508" font-size="26" fill="#4b5563" text-anchor="start">Source: tsa.gov Food, liquids pages, 8 local releases</text>
<text x="40" y="2548" font-size="26" fill="#4b5563" text-anchor="start">Pages read Nov. 24, 2026</text>
</svg>
