<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2446" viewBox="0 0 800 2446" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<title>Holiday food at TSA: what the TSA Food page and eight local Thanksgiving releases of Nov. 18 and 23, 2026 say, and where they differ.</title>
<rect width="800" height="2446" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">Holiday food at TSA</text>
<rect x="40" y="160" width="720" height="580" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="216" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">TSA Food page</text>
<text x="70" y="270" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Carry-on and checked: pies, cakes,</text>
<text x="70" y="314" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">cookies, cooked meat.</text>
<text x="70" y="374" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Carry-on, 3.4 oz (100 ml) or less:</text>
<text x="70" y="418" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">gravy, jam and jelly, maple syrup,</text>
<text x="70" y="462" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">sauces, soups.</text>
<text x="70" y="522" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Special instructions: canned foods,</text>
<text x="70" y="566" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">fresh meat and seafood, frozen food,</text>
<text x="70" y="610" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">fresh fruits and vegetables.</text>
<text x="70" y="670" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">TSA liquids page: the 3.4 oz limit is</text>
<text x="70" y="714" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">per container.</text>
<rect x="40" y="762" width="720" height="564" rx="14" fill="#d9f99d" stroke="#374151" stroke-width="4"/>
<text x="70" y="818" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">TSA local releases (Nov. 2026)</text>
<text x="70" y="872" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Eight airports, Nov. 18 and 23, 2026;</text>
<text x="70" y="916" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">same food list.</text>
<text x="70" y="976" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Carry-on, solids: pies, cakes, cookies,</text>
<text x="70" y="1020" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">turkey and other meats, stuffing, solid</text>
<text x="70" y="1064" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">casseroles, mac &#x27;n&#x27; cheese, fresh</text>
<text x="70" y="1108" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">produce.</text>
<text x="70" y="1168" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Checked bags (liquids or spreads over</text>
<text x="70" y="1212" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">3.4 oz): cranberry sauce, gravy, canned</text>
<text x="70" y="1256" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">goods in liquid, jams, jellies, maple</text>
<text x="70" y="1300" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">syrup.</text>
<rect x="40" y="1348" width="720" height="476" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="1404" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Where they differ</text>
<text x="70" y="1458" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Gravy, jam and jelly, maple syrup: the</text>
<text x="70" y="1502" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Food page allows 3.4 oz or less in</text>
<text x="70" y="1546" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">carry-on bags; the releases list them</text>
<text x="70" y="1590" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">for checked bags over 3.4 oz.</text>
<text x="70" y="1650" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">The releases do not say what applies at</text>
<text x="70" y="1694" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">3.4 oz or less.</text>
<text x="70" y="1754" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Cranberry sauce: named in the releases</text>
<text x="70" y="1798" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">only.</text>
<rect x="40" y="1846" width="720" height="312" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="70" y="1902" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Compared with Nov. 2025</text>
<text x="70" y="1956" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Harrisburg release, Nov. 24, 2025: no</text>
<text x="70" y="2000" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">figure on the checked-bag list; a 3-1-1</text>
<text x="70" y="2044" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">note for casseroles with liquid. The</text>
<text x="70" y="2088" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">2026 releases: the figure is in the</text>
<text x="70" y="2132" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">checked-bag heading; no casserole note.</text>
<text x="40" y="2214" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">The TSA officer makes the final decision</text>
<text x="40" y="2258" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">at the checkpoint.</text>
<line x1="40" y1="2292" x2="760" y2="2292" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="2336" font-size="26" fill="#4b5563" text-anchor="start">No national Thanksgiving release listed: Nov. 24, 2026</text>
<text x="40" y="2376" font-size="26" fill="#4b5563" text-anchor="start">Source: tsa.gov Food, liquids pages, 8 local releases</text>
<text x="40" y="2416" font-size="26" fill="#4b5563" text-anchor="start">Pages read Nov. 24, 2026</text>
</svg>
