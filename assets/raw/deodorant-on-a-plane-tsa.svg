<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1678" viewBox="0 0 800 1678" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<title>What TSA says about deodorant on a plane, from three TSA pages and 49 CFR 175.10(a)(1): solid, aerosol and liquid deodorant, carry-on and checked-bag lines, checked-bag totals, page dates and the final-decision line.</title>
<rect width="800" height="1678" fill="#ffffff"/>
<text x="40" y="70" font-size="46" font-weight="bold" fill="#111827">Deodorant and TSA</text>
<text x="40" y="120" font-size="32" fill="#374151">Three TSA pages, one FAA rule</text>
<rect x="40" y="170" width="720" height="176" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
<text x="70" y="224" font-size="36" font-weight="bold" fill="#111827">Solid deodorant</text>
<text x="70" y="274" font-size="29" fill="#111827">Carry-on: Yes.   Checked: Yes.</text>
<text x="70" y="320" font-size="29" fill="#111827">No size limit shown on the page.</text>
<rect x="40" y="372" width="720" height="268" rx="14" fill="#fef3c7" stroke="#92400e" stroke-width="4"/>
<text x="70" y="426" font-size="36" font-weight="bold" fill="#111827">Aerosol deodorant</text>
<text x="70" y="476" font-size="29" fill="#111827">Carry-on: Yes; 3.4 oz (100 ml)</text>
<text x="70" y="522" font-size="29" fill="#111827">or less allowed.   Checked: Yes.</text>
<text x="70" y="568" font-size="29" fill="#111827">Release device (button or nozzle)</text>
<text x="70" y="614" font-size="29" fill="#111827">must be capped or protected.</text>
<rect x="40" y="666" width="720" height="222" rx="14" fill="#fef3c7" stroke="#92400e" stroke-width="4"/>
<text x="70" y="720" font-size="36" font-weight="bold" fill="#111827">Liquid deodorant</text>
<text x="70" y="770" font-size="29" fill="#111827">Same text as the aerosol page:</text>
<text x="70" y="816" font-size="29" fill="#111827">carry-on 3.4 oz (100 ml) or less</text>
<text x="70" y="862" font-size="29" fill="#111827">allowed; checked: Yes.</text>
<rect x="40" y="914" width="720" height="314" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="4"/>
<text x="70" y="968" font-size="36" font-weight="bold" fill="#111827">Checked-bag totals</text>
<text x="70" y="1018" font-size="29" fill="#111827">Aerosol and liquid pages: per person,</text>
<text x="70" y="1064" font-size="29" fill="#111827">2 kg (70 oz) or 2 L (68 fl oz) in total.</text>
<text x="70" y="1110" font-size="29" fill="#111827">Each container: 0.5 kg (18 oz)</text>
<text x="70" y="1156" font-size="29" fill="#111827">or 500 ml (17 fl oz). TSA points</text>
<text x="70" y="1202" font-size="29" fill="#111827">to the FAA regulations.</text>
<rect x="40" y="1254" width="720" height="268" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="4" stroke-dasharray="10 8"/>
<text x="70" y="1308" font-size="36" font-weight="bold" fill="#111827">Dates and final say</text>
<text x="70" y="1358" font-size="29" fill="#111827">Solid page: March 30, 2017.</text>
<text x="70" y="1404" font-size="29" fill="#111827">Aerosol and liquid pages: March 29,</text>
<text x="70" y="1450" font-size="29" fill="#111827">2023. The final decision rests with</text>
<text x="70" y="1496" font-size="29" fill="#111827">the TSA officer.</text>
<text x="40" y="1598" font-size="25" fill="#374151">Sources: three TSA What Can I Bring? pages,</text>
<text x="40" y="1634" font-size="25" fill="#374151">49 CFR 175.10(a)(1); read Nov. 9, 2026</text>
</svg>