<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1842" viewBox="0 0 800 1842" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>TSA liquids rule: containers of 3.4 oz or less go in one quart-sized bag; larger ones go in checked baggage unless an exception applies.</title>
<rect width="800" height="1842" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">TSA liquids rule</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">at a glance</text>
<rect x="40" y="160" width="720" height="116" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="400" y="210" font-size="36" font-weight="bold" fill="#111827" text-anchor="middle">Liquids, aerosols, gels,</text>
<text x="400" y="256" font-size="36" font-weight="bold" fill="#111827" text-anchor="middle">creams and pastes</text>
<path d="M400 286 V346 M382 324 L400 346 L418 324" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="356" width="720" height="116" rx="14" fill="#fef3c7" stroke="#374151" stroke-width="4"/>
<text x="400" y="406" font-size="38" font-weight="bold" fill="#111827" text-anchor="middle">Is the container 3.4 oz</text>
<text x="400" y="454" font-size="38" font-weight="bold" fill="#111827" text-anchor="middle">(100 ml) or less?</text>
<rect x="40" y="502" width="720" height="252" rx="14" fill="#bbf7d0" stroke="#374151" stroke-width="4"/>
<text x="70" y="556" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Yes: 3.4 oz (100 ml) or less</text>
<text x="70" y="612" font-size="34" fill="#111827" text-anchor="start">Carry-on, in a quart-sized bag</text>
<text x="70" y="664" font-size="32" fill="#111827" text-anchor="start">TSA: keeping the bag separate from</text>
<text x="70" y="706" font-size="32" fill="#111827" text-anchor="start">your carry-on baggage helps screening</text>
<rect x="40" y="778" width="720" height="196" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="832" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">No: more than 3.4 oz</text>
<text x="70" y="888" font-size="34" fill="#111827" text-anchor="start">Pack it in checked baggage,</text>
<text x="70" y="936" font-size="34" fill="#111827" text-anchor="start">unless an exception applies</text>
<rect x="40" y="998" width="720" height="562" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="1052" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Exceptions TSA lists</text>
<text x="70" y="1114" font-size="34" font-weight="bold" fill="#111827" text-anchor="start">Breast milk, formula, juice</text>
<text x="70" y="1160" font-size="32" fill="#111827" text-anchor="start">Over 3.4 oz is allowed in carry-on.</text>
<text x="70" y="1202" font-size="32" fill="#111827" text-anchor="start">No quart bag needed. Removed</text>
<text x="70" y="1244" font-size="32" fill="#111827" text-anchor="start">and screened separately.</text>
<text x="70" y="1308" font-size="34" font-weight="bold" fill="#111827" text-anchor="start">Qualifying duty-free liquids</text>
<text x="70" y="1354" font-size="32" fill="#111827" text-anchor="start">Bought internationally, flying to</text>
<text x="70" y="1396" font-size="32" fill="#111827" text-anchor="start">the U.S. on a connecting flight.</text>
<text x="70" y="1438" font-size="32" fill="#111827" text-anchor="start">Tamper-evident bag, original</text>
<text x="70" y="1480" font-size="32" fill="#111827" text-anchor="start">receipt, and a purchase within</text>
<text x="70" y="1522" font-size="32" fill="#111827" text-anchor="start">48 hours.</text>
<line x1="40" y1="1600" x2="760" y2="1600" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1654" font-size="36" fill="#111827" text-anchor="start">Any liquid, aerosol, gel, cream</text>
<text x="40" y="1698" font-size="36" fill="#111827" text-anchor="start">or paste that alarms needs</text>
<text x="40" y="1742" font-size="36" fill="#111827" text-anchor="start">additional screening.</text>
<text x="40" y="1802" font-size="28" fill="#4b5563" text-anchor="start">Source: TSA website, read Oct. 7, 2026</text>
</svg>
