<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1546" viewBox="0 0 800 1546" font-family="Liberation Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Lighters on a plane, at a glance: what TSA and the FAA say about disposable and Zippo-type, arc and lithium battery, torch and liquid-fuel lighters.</title>
<rect width="800" height="1546" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">Lighters on a plane,</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">at a glance</text>
<rect x="40" y="160" width="720" height="312" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="216" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Disposable and Zippo-type</text>
<text x="70" y="270" font-size="32" fill="#111827" text-anchor="start">Carry-on: allowed (TSA). FAA: one per</text>
<text x="70" y="314" font-size="32" fill="#111827" text-anchor="start">passenger, in carry-on or on your</text>
<text x="70" y="358" font-size="32" fill="#111827" text-anchor="start">person.</text>
<text x="70" y="402" font-size="32" fill="#111827" text-anchor="start">Checked bag: TSA says yes, with special</text>
<text x="70" y="446" font-size="32" fill="#111827" text-anchor="start">instructions. FAA chart: not allowed.</text>
<rect x="40" y="494" width="720" height="356" rx="14" fill="#d9f99d" stroke="#374151" stroke-width="4"/>
<text x="70" y="550" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Arc, electronic, lithium battery</text>
<text x="70" y="604" font-size="32" fill="#111827" text-anchor="start">Carry-on only (TSA, FAA). Checked bag:</text>
<text x="70" y="648" font-size="32" fill="#111827" text-anchor="start">no.</text>
<text x="70" y="692" font-size="32" fill="#111827" text-anchor="start">Prevent unintentional activation. No</text>
<text x="70" y="736" font-size="32" fill="#111827" text-anchor="start">recharging on board.</text>
<text x="70" y="780" font-size="32" fill="#111827" text-anchor="start">Batteries: up to 100 Wh (lithium ion)</text>
<text x="70" y="824" font-size="32" fill="#111827" text-anchor="start">or 2 g (lithium metal).</text>
<rect x="40" y="872" width="720" height="180" rx="14" fill="#fecaca" stroke="#374151" stroke-width="4"/>
<text x="70" y="928" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Torch lighters</text>
<text x="70" y="982" font-size="32" fill="#111827" text-anchor="start">Not allowed in carry-on or checked bags</text>
<text x="70" y="1026" font-size="32" fill="#111827" text-anchor="start">(TSA, FAA).</text>
<rect x="40" y="1074" width="720" height="268" rx="14" fill="#fecaca" stroke="#374151" stroke-width="4"/>
<text x="70" y="1130" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Unabsorbed liquid fuel; lighter fluid</text>
<text x="70" y="1184" font-size="32" fill="#111827" text-anchor="start">Lighters with unabsorbed liquid fuel,</text>
<text x="70" y="1228" font-size="32" fill="#111827" text-anchor="start">and lighter fluid or refills: not</text>
<text x="70" y="1272" font-size="32" fill="#111827" text-anchor="start">allowed (FAA, 49 CFR 175.10; TSA for</text>
<text x="70" y="1316" font-size="32" fill="#111827" text-anchor="start">lighter fluid).</text>
<text x="40" y="1398" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">The TSA officer makes the final decision.</text>
<line x1="40" y1="1432" x2="760" y2="1432" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1476" font-size="26" fill="#4b5563" text-anchor="start">One-lighter limit: FAA page and chart</text>
<text x="40" y="1516" font-size="26" fill="#4b5563" text-anchor="start">Source: TSA, FAA and eCFR pages, read Oct. 29, 2026</text>
</svg>
