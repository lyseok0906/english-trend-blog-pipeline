<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1934" viewBox="0 0 800 1934" font-family="Liberation Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Lighters on a plane, at a glance: what TSA and the FAA say about disposable and Zippo-type, arc and lithium battery, torch and liquid-fuel lighters.</title>
<rect width="800" height="1934" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">Lighters on a plane,</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">at a glance</text>
<rect x="40" y="160" width="720" height="580" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="216" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Disposable and Zippo-type</text>
<text x="70" y="270" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve"><tspan font-weight="bold">Carry-on bag: </tspan>FAA: one per passenger,</text>
<text x="70" y="314" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">in carry-on or on your person. TSA:</text>
<text x="70" y="358" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">allowed.</text>
<text x="70" y="418" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve"><tspan font-weight="bold">Checked bag, TSA: </tspan>allowed without fuel.</text>
<text x="70" y="462" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">With fuel, prohibited unless a DOT</text>
<text x="70" y="506" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">exemption applies (up to two, in a DOT</text>
<text x="70" y="550" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">approved case).</text>
<text x="70" y="610" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve"><tspan font-weight="bold">Checked bag, FAA chart: </tspan>not allowed.</text>
<text x="70" y="654" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">The two sources differ.</text>
<text x="70" y="714" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve"><tspan font-weight="bold">Current DOT permit: </tspan>not confirmed here.</text>
<rect x="40" y="762" width="720" height="388" rx="14" fill="#d9f99d" stroke="#374151" stroke-width="4"/>
<text x="70" y="818" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Arc, electronic, lithium battery</text>
<text x="70" y="872" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Carry-on only (TSA, FAA). Checked bag:</text>
<text x="70" y="916" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">no.</text>
<text x="70" y="976" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Prevent unintentional activation. No</text>
<text x="70" y="1020" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">recharging on board.</text>
<text x="70" y="1080" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Batteries: up to 100 Wh (lithium ion)</text>
<text x="70" y="1124" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">or 2 g (lithium metal).</text>
<rect x="40" y="1172" width="720" height="180" rx="14" fill="#fecaca" stroke="#374151" stroke-width="4"/>
<text x="70" y="1228" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Torch lighters</text>
<text x="70" y="1282" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Not allowed in carry-on or checked bags</text>
<text x="70" y="1326" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">(TSA, FAA).</text>
<rect x="40" y="1374" width="720" height="268" rx="14" fill="#fecaca" stroke="#374151" stroke-width="4"/>
<text x="70" y="1430" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Unabsorbed liquid fuel; lighter fluid</text>
<text x="70" y="1484" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Lighters with unabsorbed liquid fuel,</text>
<text x="70" y="1528" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">and lighter fluid or refills: not</text>
<text x="70" y="1572" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">allowed (FAA, 49 CFR 175.10; TSA for</text>
<text x="70" y="1616" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">lighter fluid).</text>
<text x="40" y="1698" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">At the security checkpoint, the TSA</text>
<text x="40" y="1742" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">officer decides whether an item is</text>
<text x="40" y="1786" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">allowed through.</text>
<line x1="40" y1="1820" x2="760" y2="1820" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1864" font-size="26" fill="#4b5563" text-anchor="start">One-lighter limit: FAA page and chart</text>
<text x="40" y="1904" font-size="26" fill="#4b5563" text-anchor="start">Source: TSA, FAA and eCFR pages, read Oct. 29, 2026</text>
</svg>
