<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2336" viewBox="0 0 800 2336" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<title>Diagram of the three kinds of locker USPS pages describe. USPS Smart Locker: in a Post Office lobby; opens with a one-time QR code or access code from an email; other packages: 5 calendar days in the locker, then 10 more days at the retail counter with acceptable photo ID, returned to the sender 15 days after the first notification. Priority Mail Express has its own count: the FAQ says it is returned to the sender 5 days after the first delivery attempt, USPS.com says after 5 days in the locker. Eligible: Ground Advantage, Priority Mail Express, Priority Mail, Media Mail; domestic packages only. gopost: registered account, card and PIN; units near some Post Offices, stores and transport hubs; up to 15 days, 5 for Priority Mail Express. Cluster box parcel locker: a key left in your mailbox, tagged with the locker number; for items too large for the compartment; the FAQ gives no hold time. The pages differ on where the Priority Mail Express count starts and on hours.</title>
<rect width="800" height="2336" fill="#ffffff"/>
<text x="40" y="70" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">USPS lockers: 3 kinds</text>
<text x="40" y="120" font-size="32" fill="#374151" text-anchor="start">What the USPS pages say</text>
<rect x="40" y="160" width="720" height="802" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="4"/>
<text x="70" y="218" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">1. USPS Smart Locker</text>
<text x="70" y="272" font-size="32" fill="#111827" text-anchor="start">In a Post Office lobby. Opens with a</text>
<text x="70" y="318" font-size="32" fill="#111827" text-anchor="start">one-time QR code or access code from</text>
<text x="70" y="364" font-size="32" fill="#111827" text-anchor="start">an email. Other packages: 5 calendar</text>
<text x="70" y="410" font-size="32" fill="#111827" text-anchor="start">days in the locker, then 10 more days</text>
<text x="70" y="456" font-size="32" fill="#111827" text-anchor="start">at the counter (acceptable photo ID),</text>
<text x="70" y="502" font-size="32" fill="#111827" text-anchor="start">returned 15 days after the first</text>
<text x="70" y="548" font-size="32" fill="#111827" text-anchor="start">notification.</text>
<text x="70" y="594" font-size="32" fill="#111827" text-anchor="start">Priority Mail Express has its own</text>
<text x="70" y="640" font-size="32" fill="#111827" text-anchor="start">count: the FAQ says returned to the</text>
<text x="70" y="686" font-size="32" fill="#111827" text-anchor="start">sender 5 days after the first</text>
<text x="70" y="732" font-size="32" fill="#111827" text-anchor="start">delivery attempt; USPS.com says</text>
<text x="70" y="778" font-size="32" fill="#111827" text-anchor="start">after 5 days in the locker.</text>
<text x="70" y="824" font-size="32" fill="#111827" text-anchor="start">Sent with Ground Advantage, Priority</text>
<text x="70" y="870" font-size="32" fill="#111827" text-anchor="start">Mail Express, Priority Mail or Media</text>
<text x="70" y="916" font-size="32" fill="#111827" text-anchor="start">Mail; domestic packages only.</text>
<rect x="40" y="992" width="720" height="342" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
<text x="70" y="1050" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">2. gopost</text>
<text x="70" y="1104" font-size="32" fill="#111827" text-anchor="start">Registered account, card and PIN.</text>
<text x="70" y="1150" font-size="32" fill="#111827" text-anchor="start">Units near some Post Offices, grocery</text>
<text x="70" y="1196" font-size="32" fill="#111827" text-anchor="start">stores, pharmacies, transportation</text>
<text x="70" y="1242" font-size="32" fill="#111827" text-anchor="start">hubs. Up to 15 days to pick up; 5 for</text>
<text x="70" y="1288" font-size="32" fill="#111827" text-anchor="start">Priority Mail Express.</text>
<rect x="40" y="1364" width="720" height="296" rx="14" fill="#fef3c7" stroke="#92400e" stroke-width="4"/>
<text x="70" y="1422" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">3. Cluster box parcel locker</text>
<text x="70" y="1476" font-size="32" fill="#111827" text-anchor="start">A key left in your mailbox, tagged</text>
<text x="70" y="1522" font-size="32" fill="#111827" text-anchor="start">with the locker. For items too large</text>
<text x="70" y="1568" font-size="32" fill="#111827" text-anchor="start">for the compartment. The FAQ gives no</text>
<text x="70" y="1614" font-size="32" fill="#111827" text-anchor="start">hold time.</text>
<rect x="40" y="1690" width="720" height="526" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="4" stroke-dasharray="10 8"/>
<text x="70" y="1748" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Where the pages differ</text>
<text x="70" y="1802" font-size="32" fill="#111827" text-anchor="start">Priority Mail Express: the FAQ says it is</text>
<text x="70" y="1848" font-size="32" fill="#111827" text-anchor="start">returned 5 days after the first</text>
<text x="70" y="1894" font-size="32" fill="#111827" text-anchor="start">delivery attempt; USPS.com says it is</text>
<text x="70" y="1940" font-size="32" fill="#111827" text-anchor="start">returned after 5 days in the locker.</text>
<text x="70" y="1986" font-size="32" fill="#111827" text-anchor="start">Hours: "anytime" (USPS.com) or lobby</text>
<text x="70" y="2032" font-size="32" fill="#111827" text-anchor="start">hours at some lockers (FAQ). Notice</text>
<text x="70" y="2078" font-size="32" fill="#111827" text-anchor="start">box: "Parcel Locker Eligible" on older</text>
<text x="70" y="2124" font-size="32" fill="#111827" text-anchor="start">forms, "Smart Locker Eligible" on</text>
<text x="70" y="2170" font-size="32" fill="#111827" text-anchor="start">the September 2022 version.</text>
<text x="40" y="2276" font-size="28" fill="#374151" text-anchor="start">Sources: USPS FAQs 000008414, 000006975,</text>
<text x="40" y="2310" font-size="28" fill="#374151" text-anchor="start">000007973; USPS.com; read Nov. 24, 2026</text>
</svg>