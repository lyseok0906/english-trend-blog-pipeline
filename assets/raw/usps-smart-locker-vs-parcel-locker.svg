<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2060" viewBox="0 0 800 2060" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<title>Diagram of the three kinds of locker USPS pages describe. USPS Smart Locker: in a Post Office lobby; opens with a one-time QR code or access code from an email; 5 calendar days in the locker, then 10 more days at the retail counter with acceptable photo ID, returned to the sender 15 days after the first notification; Priority Mail Express is returned after 5 days. Eligible: Ground Advantage, Priority Mail Express, Priority Mail, Media Mail; domestic packages only. gopost: registered account, card and PIN; units near some Post Offices, stores and transport hubs; up to 15 days, 5 for Priority Mail Express. Cluster box parcel locker: a key left in your mailbox, tagged with the locker number; for items too large for the compartment; the FAQ gives no hold time. The pages differ on when Priority Mail Express is returned and on hours.</title>
<rect width="800" height="2060" fill="#ffffff"/>
<text x="40" y="70" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">USPS lockers: 3 kinds</text>
<text x="40" y="120" font-size="32" fill="#374151" text-anchor="start">What the USPS pages say</text>
<rect x="40" y="160" width="720" height="572" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="4"/>
<text x="70" y="218" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">1. USPS Smart Locker</text>
<text x="70" y="272" font-size="32" fill="#111827" text-anchor="start">In a Post Office lobby. Opens with a</text>
<text x="70" y="318" font-size="32" fill="#111827" text-anchor="start">one-time QR code or access code from</text>
<text x="70" y="364" font-size="32" fill="#111827" text-anchor="start">an email. 5 calendar days in the</text>
<text x="70" y="410" font-size="32" fill="#111827" text-anchor="start">locker, then 10 more days at the</text>
<text x="70" y="456" font-size="32" fill="#111827" text-anchor="start">counter (acceptable photo ID). Returned</text>
<text x="70" y="502" font-size="32" fill="#111827" text-anchor="start">15 days after the first notification.</text>
<text x="70" y="548" font-size="32" fill="#111827" text-anchor="start">Priority Mail Express: returned after</text>
<text x="70" y="594" font-size="32" fill="#111827" text-anchor="start">5 days. Sent with Ground Advantage,</text>
<text x="70" y="640" font-size="32" fill="#111827" text-anchor="start">Priority Mail Express, Priority Mail</text>
<text x="70" y="686" font-size="32" fill="#111827" text-anchor="start">or Media Mail; domestic packages only.</text>
<rect x="40" y="762" width="720" height="342" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
<text x="70" y="820" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">2. gopost</text>
<text x="70" y="874" font-size="32" fill="#111827" text-anchor="start">Registered account, card and PIN.</text>
<text x="70" y="920" font-size="32" fill="#111827" text-anchor="start">Units near some Post Offices, grocery</text>
<text x="70" y="966" font-size="32" fill="#111827" text-anchor="start">stores, pharmacies, transportation</text>
<text x="70" y="1012" font-size="32" fill="#111827" text-anchor="start">hubs. Up to 15 days to pick up; 5 for</text>
<text x="70" y="1058" font-size="32" fill="#111827" text-anchor="start">Priority Mail Express.</text>
<rect x="40" y="1134" width="720" height="296" rx="14" fill="#fef3c7" stroke="#92400e" stroke-width="4"/>
<text x="70" y="1192" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">3. Cluster box parcel locker</text>
<text x="70" y="1246" font-size="32" fill="#111827" text-anchor="start">A key left in your mailbox, tagged</text>
<text x="70" y="1292" font-size="32" fill="#111827" text-anchor="start">with the locker. For items too large</text>
<text x="70" y="1338" font-size="32" fill="#111827" text-anchor="start">for the compartment. The FAQ gives no</text>
<text x="70" y="1384" font-size="32" fill="#111827" text-anchor="start">hold time.</text>
<rect x="40" y="1460" width="720" height="480" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="4" stroke-dasharray="10 8"/>
<text x="70" y="1518" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Where the pages differ</text>
<text x="70" y="1572" font-size="32" fill="#111827" text-anchor="start">Priority Mail Express: "immediately</text>
<text x="70" y="1618" font-size="32" fill="#111827" text-anchor="start">returned" after 5 days (USPS.com) or</text>
<text x="70" y="1664" font-size="32" fill="#111827" text-anchor="start">5 days after the first attempt (FAQ).</text>
<text x="70" y="1710" font-size="32" fill="#111827" text-anchor="start">Hours: "anytime" (USPS.com) or lobby</text>
<text x="70" y="1756" font-size="32" fill="#111827" text-anchor="start">hours at some lockers (FAQ). Notice</text>
<text x="70" y="1802" font-size="32" fill="#111827" text-anchor="start">box: "Parcel Locker Eligible" on older</text>
<text x="70" y="1848" font-size="32" fill="#111827" text-anchor="start">forms, "Smart Locker Eligible" on</text>
<text x="70" y="1894" font-size="32" fill="#111827" text-anchor="start">the September 2022 version.</text>
<text x="40" y="2000" font-size="28" fill="#374151" text-anchor="start">Sources: USPS FAQs 000008414, 000006975,</text>
<text x="40" y="2034" font-size="28" fill="#374151" text-anchor="start">000007973; USPS.com; read Nov. 24, 2026</text>
</svg>