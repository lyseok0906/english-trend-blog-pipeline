<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1524" viewBox="0 0 800 1524" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<title>Alcohol on a plane, at a glance: what TSA and the FAA say about carry-on bags, checked bags, alcohol percentage and drinking on board.</title>
<rect width="800" height="1524" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">Alcohol on a plane,</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">at a glance</text>
<rect x="40" y="160" width="720" height="224" rx="14" fill="#bbf7d0" stroke="#374151" stroke-width="4"/>
<text x="70" y="216" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Carry-on bag</text>
<text x="70" y="270" font-size="32" fill="#111827" text-anchor="start">Allowed in 3.4 oz (100 ml) amounts</text>
<text x="70" y="314" font-size="32" fill="#111827" text-anchor="start">or less (TSA). Mini bottles must fit</text>
<text x="70" y="358" font-size="32" fill="#111827" text-anchor="start">in a single quart-sized bag (TSA).</text>
<rect x="40" y="406" width="720" height="178" rx="14" fill="#d9f99d" stroke="#374151" stroke-width="4"/>
<text x="70" y="462" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Checked bag: 24% or less</text>
<text x="70" y="516" font-size="32" fill="#111827" text-anchor="start">Not subject to limitations in</text>
<text x="70" y="560" font-size="32" fill="#111827" text-anchor="start">checked bags (TSA).</text>
<rect x="40" y="606" width="720" height="224" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="662" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Checked bag: over 24% up to 70%</text>
<text x="70" y="716" font-size="32" fill="#111827" text-anchor="start">Unopened retail packaging only.</text>
<text x="70" y="760" font-size="32" fill="#111827" text-anchor="start">5 L (1.3 gal) total per passenger</text>
<text x="70" y="804" font-size="32" fill="#111827" text-anchor="start">(TSA and FAA).</text>
<rect x="40" y="852" width="720" height="224" rx="14" fill="#fecaca" stroke="#374151" stroke-width="4"/>
<text x="70" y="908" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Over 70% (over 140 proof)</text>
<text x="70" y="962" font-size="32" fill="#111827" text-anchor="start">Not allowed in carry-on or checked</text>
<text x="70" y="1006" font-size="32" fill="#111827" text-anchor="start">bags (TSA; FAA chart). Includes</text>
<text x="70" y="1050" font-size="32" fill="#111827" text-anchor="start">grain alcohol and 151 proof rum.</text>
<rect x="40" y="1098" width="720" height="178" rx="14" fill="#dbeafe" stroke="#374151" stroke-width="4"/>
<text x="70" y="1154" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">On board</text>
<text x="70" y="1208" font-size="32" fill="#111827" text-anchor="start">FAA: no drinking alcohol on board</text>
<text x="70" y="1252" font-size="32" fill="#111827" text-anchor="start">unless the air carrier serves it.</text>
<text x="40" y="1332" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">TSA: check with your airline.</text>
<text x="40" y="1378" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">The TSA officer makes the final decision.</text>
<line x1="40" y1="1412" x2="760" y2="1412" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1456" font-size="26" fill="#4b5563" text-anchor="start">% = alcohol by volume (FAA, 49 CFR 175.10)</text>
<text x="40" y="1496" font-size="26" fill="#4b5563" text-anchor="start">Source: TSA, FAA and eCFR pages, read Oct. 13, 2026</text>
</svg>
