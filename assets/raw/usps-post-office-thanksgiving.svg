<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1320" viewBox="0 0 800 1320" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<title>Thanksgiving 2026 at the Post Office, as stated in USPS's national release of November 17, 2026. Thursday, November 26: USPS observes Thanksgiving and all Post Office locations are closed. Friday, November 27: regular mail delivery and retail services resume. While Post Offices are closed: the notice points customers to usps.com and to self-service kiosks in select lobbies. Not in the notice: whether Priority Mail Express is delivered on November 26; the notice does not say either way.</title>
<rect width="800" height="1320" fill="#ffffff"/>
<text x="40" y="70" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">Thanksgiving 2026</text>
<text x="40" y="120" font-size="32" fill="#374151" text-anchor="start">What USPS's Nov. 17, 2026 notice says</text>
<rect x="40" y="160" width="720" height="250" rx="14" fill="#fee2e2" stroke="#991b1b" stroke-width="4"/>
<text x="70" y="218" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Thursday, November 26</text>
<text x="70" y="272" font-size="32" fill="#111827" text-anchor="start">USPS will observe Thanksgiving.</text>
<text x="70" y="318" font-size="32" fill="#111827" text-anchor="start">All Post Office locations will be</text>
<text x="70" y="364" font-size="32" fill="#111827" text-anchor="start">closed.</text>
<rect x="40" y="440" width="720" height="204" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
<text x="70" y="498" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Friday, November 27</text>
<text x="70" y="552" font-size="32" fill="#111827" text-anchor="start">Regular mail delivery and retail</text>
<text x="70" y="598" font-size="32" fill="#111827" text-anchor="start">services will resume.</text>
<rect x="40" y="674" width="720" height="296" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="4"/>
<text x="70" y="732" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">While Post Offices are closed</text>
<text x="70" y="786" font-size="32" fill="#111827" text-anchor="start">The notice points customers to</text>
<text x="70" y="832" font-size="32" fill="#111827" text-anchor="start">usps.com (stamps, Hold Mail, Change</text>
<text x="70" y="878" font-size="32" fill="#111827" text-anchor="start">of Address, Click-N-Ship) and to</text>
<text x="70" y="924" font-size="32" fill="#111827" text-anchor="start">self-service kiosks in select lobbies.</text>
<rect x="40" y="1000" width="720" height="250" rx="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="4" stroke-dasharray="10 8"/>
<text x="70" y="1058" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Not in the notice</text>
<text x="70" y="1112" font-size="32" fill="#111827" text-anchor="start">Whether Priority Mail Express is</text>
<text x="70" y="1158" font-size="32" fill="#111827" text-anchor="start">delivered on November 26: the</text>
<text x="70" y="1204" font-size="32" fill="#111827" text-anchor="start">notice does not say, either way.</text>
<text x="40" y="1290" font-size="28" fill="#374151" text-anchor="start">Source: USPS national release, Nov. 17, 2026</text>
</svg>