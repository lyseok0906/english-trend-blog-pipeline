<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1006" viewBox="0 0 800 1006" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The two start dates of winter 2026: meteorological winter begins on December 1, and astronomical winter begins at the December 21 solstice.</title>
<rect width="800" height="1006" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">Two start dates for</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">winter 2026</text>
<rect x="40" y="160" width="720" height="236" rx="14" fill="#bbf7d0" stroke="#374151" stroke-width="4"/>
<text x="70" y="214" font-size="40" font-weight="bold" fill="#111827" text-anchor="start">Tuesday, December 1</text>
<text x="70" y="272" font-size="34" fill="#111827" text-anchor="start">Meteorological winter begins</text>
<text x="70" y="320" font-size="32" fill="#111827" text-anchor="start">It runs through December,</text>
<text x="70" y="362" font-size="32" fill="#111827" text-anchor="start">January and February (NOAA).</text>
<path d="M400 406 V486 M382 464 L400 486 L418 464" stroke="#111827" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="458" font-size="32" fill="#374151" text-anchor="start">20 days later</text>
<rect x="40" y="496" width="720" height="380" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="550" font-size="40" font-weight="bold" fill="#111827" text-anchor="start">Monday, December 21</text>
<text x="70" y="608" font-size="34" fill="#111827" text-anchor="start">Winter solstice: astronomical</text>
<text x="70" y="656" font-size="34" fill="#111827" text-anchor="start">winter begins (USNO).</text>
<text x="70" y="708" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">Standard time:</text>
<text x="70" y="752" font-size="32" fill="#111827" text-anchor="start">3:50 p.m. Eastern</text>
<text x="70" y="794" font-size="32" fill="#111827" text-anchor="start">12:50 p.m. Pacific</text>
<text x="70" y="836" font-size="32" fill="#111827" text-anchor="start">10:50 a.m. Hawaii-Aleutian</text>
<line x1="40" y1="916" x2="760" y2="916" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="970" font-size="28" fill="#4b5563" text-anchor="start">Source: USNO and NOAA, read Oct. 7, 2026</text>
</svg>
