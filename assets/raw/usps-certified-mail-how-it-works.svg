<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2138" viewBox="0 0 800 2138" font-family="Liberation Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>USPS Certified Mail at a glance: how it works, add-ons, what is not included and the 15-day hold described in the USPS FAQ.</title>
<rect width="800" height="2138" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">USPS Certified Mail,</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">at a glance</text>
<rect x="40" y="160" width="720" height="580" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="216" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">How it works</text>
<text x="70" y="270" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">1. Bought at the time of mailing, with</text>
<text x="70" y="314" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">    Priority Mail or First-Class Mail.</text>
<text x="70" y="374" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">2. You get a mailing receipt (PS Form</text>
<text x="70" y="418" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">    3800).</text>
<text x="70" y="478" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">3. The recipient signs and prints a</text>
<text x="70" y="522" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">    name (DMM 508).</text>
<text x="70" y="582" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">4. If requested: electronic</text>
<text x="70" y="626" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">    verification of delivery or an</text>
<text x="70" y="670" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">    attempt, checked on USPS.com or by</text>
<text x="70" y="714" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">    phone with the receipt number.</text>
<rect x="40" y="762" width="720" height="328" rx="14" fill="#d9f99d" stroke="#374151" stroke-width="4"/>
<text x="70" y="818" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Add-ons</text>
<text x="70" y="872" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Return Receipt: hard copy or</text>
<text x="70" y="916" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">electronic.</text>
<text x="70" y="976" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Restricted Delivery: only the addressee</text>
<text x="70" y="1020" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">or an agent authorized in writing (DMM</text>
<text x="70" y="1064" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">508).</text>
<rect x="40" y="1112" width="720" height="240" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="1168" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Not included</text>
<text x="70" y="1222" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Insurance of its own (Priority Mail&#x27;s</text>
<text x="70" y="1266" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">included insurance stays).</text>
<text x="70" y="1326" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">International mail: not available.</text>
<rect x="40" y="1374" width="720" height="520" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="70" y="1430" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">If it cannot be delivered</text>
<text x="70" y="1484" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">The addressee gets a notice. If the</text>
<text x="70" y="1528" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">piece is not called for or redelivery</text>
<text x="70" y="1572" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">is not requested, it is returned after</text>
<text x="70" y="1616" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">15 days (DMM 508). FAQ: held 15 days,</text>
<text x="70" y="1660" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">returned on the 16th day.</text>
<text x="70" y="1720" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">The sender may specify fewer days on</text>
<text x="70" y="1764" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">the piece.</text>
<text x="70" y="1824" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">The pages do not say when the count</text>
<text x="70" y="1868" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">starts.</text>
<text x="40" y="1950" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">Legal effect is not covered here.</text>
<line x1="40" y1="1984" x2="760" y2="1984" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="2028" font-size="26" fill="#4b5563" text-anchor="start">No price shown: see USPS Notice 123</text>
<text x="40" y="2068" font-size="26" fill="#4b5563" text-anchor="start">Source: USPS FAQ, DMM 503 and 508, Notice 123</text>
<text x="40" y="2108" font-size="26" fill="#4b5563" text-anchor="start">Pages read Oct. 29, 2026</text>
</svg>
