<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1798" viewBox="0 0 800 1798" font-family="Liberation Sans, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>USPS Certified Mail at a glance: how it works, add-ons, what is not included and the 15-day hold described in the USPS FAQ.</title>
<rect width="800" height="1798" fill="#ffffff"/>
<text x="40" y="66" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">USPS Certified Mail,</text>
<text x="40" y="122" font-size="46" font-weight="bold" fill="#111827" text-anchor="start">at a glance</text>
<rect x="40" y="160" width="720" height="580" rx="14" fill="#bfdbfe" stroke="#374151" stroke-width="4"/>
<text x="70" y="216" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">How it works</text>
<text x="70" y="270" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">1. Bought at the time of mailing, with</text>
<text x="70" y="314" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">    Priority Mail or First-Class Mail.</text>
<text x="70" y="374" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">2. You get a mailing receipt (PS Form</text>
<text x="70" y="418" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">    3800).</text>
<text x="70" y="478" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">3. If requested: electronic</text>
<text x="70" y="522" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">    verification of delivery or a</text>
<text x="70" y="566" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">    delivery attempt.</text>
<text x="70" y="626" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">4. Check status on USPS.com or by</text>
<text x="70" y="670" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">    phone, using the number on the</text>
<text x="70" y="714" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">    receipt.</text>
<rect x="40" y="762" width="720" height="284" rx="14" fill="#d9f99d" stroke="#374151" stroke-width="4"/>
<text x="70" y="818" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Add-ons</text>
<text x="70" y="872" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Return Receipt: hard copy or</text>
<text x="70" y="916" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">electronic.</text>
<text x="70" y="976" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Restricted Delivery: only the addressee</text>
<text x="70" y="1020" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">or the authorized agent.</text>
<rect x="40" y="1068" width="720" height="240" rx="14" fill="#fde68a" stroke="#374151" stroke-width="4"/>
<text x="70" y="1124" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">Not included</text>
<text x="70" y="1178" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Insurance of its own (Priority Mail&#x27;s</text>
<text x="70" y="1222" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">included insurance stays).</text>
<text x="70" y="1282" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">International mail: not available.</text>
<rect x="40" y="1330" width="720" height="224" rx="14" fill="#e5e7eb" stroke="#374151" stroke-width="4"/>
<text x="70" y="1386" font-size="38" font-weight="bold" fill="#111827" text-anchor="start">The 15-day hold</text>
<text x="70" y="1440" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Per the USPS FAQ: held at the Post</text>
<text x="70" y="1484" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">Office 15 days, returned to sender on</text>
<text x="70" y="1528" font-size="32" fill="#111827" text-anchor="start" xml:space="preserve">the 16th day.</text>
<text x="40" y="1610" font-size="32" font-weight="bold" fill="#111827" text-anchor="start">Legal effect is not covered here.</text>
<line x1="40" y1="1644" x2="760" y2="1644" stroke="#d1d5db" stroke-width="3"/>
<text x="40" y="1688" font-size="26" fill="#4b5563" text-anchor="start">No price shown: see USPS Notice 123</text>
<text x="40" y="1728" font-size="26" fill="#4b5563" text-anchor="start">Source: USPS FAQ, DMM 503, USPS.com, Notice 123</text>
<text x="40" y="1768" font-size="26" fill="#4b5563" text-anchor="start">Pages read Oct. 29, 2026</text>
</svg>
